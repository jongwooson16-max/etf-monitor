<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#f5f6fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ETF 모니터">
<title>ETF 포트폴리오 모니터</title>
<link rel="manifest" href="manifest.json">

<style>
:root {
  /* 전체 배경 — 화이트 톤 */
  --bg:       #f4f5f9;
  --surface:  #ffffff;
  --card:     #ffffff;
  --border:   #e3e5ee;
  --text:     #1c1f2b;
  --muted:    #8a8fa3;
  --accent:   #4a6cf7;
  --success:  #1aa971;
  --danger:   #e0334f;   /* 상승(빨강) */
  --rise:     #e0334f;   /* 상승 */
  --fall:     #3b6fe0;   /* 하락(파랑) */
  --warning:  #d98c0b;
  --purple:   #8b5cf6;
  --teal:     #0d9488;
  /* 제목/히어로 영역 — 기존 다크톤 그대로 유지(포인트) */
  --dark-bg:      #1a1d27;
  --dark-surface: #21253a;
  --dark-border:  #343a52;
  --dark-text:    #f2f3f7;
  --dark-muted:   #9aa1b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, 'Noto Sans KR', sans-serif; min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }

/* 헤더 — 다크톤 유지 */
.header { background: var(--dark-bg); border-bottom: 1px solid var(--dark-border); padding: 12px 16px 8px; position: sticky; top: 0; z-index: 100; }
.header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.header h1 { font-size: 16px; font-weight: 700; color: var(--dark-text); }
.updated { font-size: 9.5px; color: var(--dark-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
.refresh-btn { background: var(--dark-surface); border: 1px solid var(--dark-border); color: #8fa8ff; padding: 6px 12px; border-radius: 8px; font-size: 11px; cursor: pointer; }

/* 최상단 히어로 요약 — 다크톤 유지(제목 영역과 통일된 포인트) */
.hero { margin: 12px 14px 4px; background: linear-gradient(135deg, #232849, #1a1d33); border: 1px solid var(--dark-border); border-radius: 14px; padding: 14px 14px 12px; }
.hero-title { font-size: 11px; color: var(--dark-muted); margin-bottom: 10px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero-metrics { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.hero-metrics-2 { grid-template-columns: repeat(2, 1fr); margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--dark-border); }
.hero-metric { text-align: center; color: var(--dark-text); }
.hero-metric-label { font-size: 9px; color: var(--dark-muted); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero-metric-val { font-size: 13px; font-weight: 700; color: var(--dark-text); }
.hero-metric-sub { font-size: 9px; margin-top: 1px; }
.hero-div { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--dark-border); display: flex; justify-content: space-between; align-items: center; }
.hero-div-label { font-size: 11px; color: var(--dark-muted); }
.hero-div-val { font-size: 16px; font-weight: 700; color: var(--warning); }
.hero .pos { color: #ff6b81; }
.hero .neg { color: #7ba3ff; }

/* 탭 */
.tabs { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 7px 13px; font-size: 11px; color: var(--dark-muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; background: none; border-top: none; border-left: none; border-right: none; font-family: inherit; flex-shrink: 0; }
.tab.active { color: #8fa8ff; border-bottom-color: #8fa8ff; }

/* 요약 */
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 14px; }
.sum-card { background: var(--card); border-radius: 10px; padding: 10px 12px; border: 1px solid var(--border); box-shadow: 0 1px 2px rgba(20,20,40,.04); }
.sum-label { font-size: 9px; color: var(--muted); margin-bottom: 4px; }
.sum-val { font-size: 20px; font-weight: 700; }
.sum-sub { font-size: 9px; color: var(--muted); margin-top: 2px; }

/* 섹션 제목 */
.section-title { font-size: 10px; color: var(--muted); padding: 10px 14px 4px; letter-spacing: .06em; font-weight: 600; }

/* ETF 카드 */
.etf-list { padding: 0 14px 20px; display: flex; flex-direction: column; gap: 8px; }
.etf-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: border-color .2s; box-shadow: 0 1px 3px rgba(20,20,40,.05); }
.etf-card.ok { border-left: 3px solid var(--success); }
.etf-card.fail { border-left: 3px solid var(--danger); }
.etf-card.pending { border-left: 3px solid var(--border); }

.card-head { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 14px 8px; gap: 8px; cursor: pointer; }
.card-name { font-size: 13px; font-weight: 600; line-height: 1.35; }
.card-meta { font-size: 10px; color: var(--muted); margin-top: 2px; }

.tag { font-size: 9px; padding: 2px 7px; border-radius: 5px; white-space: nowrap; font-weight: 600; flex-shrink: 0; }
.tag-kr_idx { background: #e8f0ff; color: #2f5fd9; }
.tag-us_idx { background: #e6f7ec; color: #17915a; }
.tag-kr_div { background: #fde8ee; color: #d43a6a; }
.tag-us_div { background: #f1eaff; color: #7c3aed; }

/* 지표 그리드 */
.metrics { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--border); }
.metric { background: var(--surface); padding: 8px 6px; text-align: center; }
.metric-label { font-size: 8px; color: var(--muted); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.metric-val { font-size: 13px; font-weight: 700; }
.pos { color: var(--rise); }   /* 한국식: 상승=빨강 */
.neg { color: var(--fall); }   /* 하락=파랑 */
.flat { color: var(--muted); }

/* 확장 상세 */
.card-detail { display: none; padding: 10px 14px 12px; border-top: 1px solid var(--border); }
.card-detail.open { display: block; }
.detail-row { display: flex; justify-content: space-between; font-size: 11px; padding: 4px 0; border-bottom: 1px solid var(--border); }
.detail-row:last-child { border: none; }
.detail-label { color: var(--muted); }
.detail-val { font-weight: 600; }

/* 로딩 */
.loading { text-align: center; padding: 60px 20px; color: var(--muted); }
.spinner { font-size: 32px; animation: spin 1s linear infinite; display: inline-block; margin-bottom: 12px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 에러 배너 */
.error-banner { background: #fdeceb; border: 1px solid #f3b9bb; color: #c22a3e; padding: 10px 14px; font-size: 12px; margin: 10px 14px; border-radius: 8px; display: none; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>📊 ETF 모니터</h1>
    <button class="refresh-btn" onclick="loadData()">↻ 새로고침</button>
  </div>
  <div id="live-badge" class="updated"></div>
</div>

<div id="hero"></div>

<div class="header" style="position:sticky; top:0; padding-top:6px;">
  <div class="tabs" id="tab-nav"></div>
</div>

<div id="error-banner" class="error-banner"></div>
<div id="app-content"><div class="loading"><div class="spinner">⏳</div><br>데이터 로딩 중...</div></div>

<script>
const CAT_LABELS = {kr_idx:"🇰🇷 한국지수", kr_div:"🇰🇷 한국배당", us_idx:"🇺🇸 미국지수", us_div:"🇺🇸 미국배당"};

const TABS = [
  {id:"all",    label:"전체"},
  {id:"kr_idx", label:"🇰🇷 한국지수"},
  {id:"kr_div", label:"🇰🇷 한국배당"},
  {id:"us_idx", label:"🇺🇸 미국지수"},
  {id:"us_div", label:"🇺🇸 미국배당"},
];

let allData = { etfs: [] };
let allHistory = {series:{}};
let activeTab = "all";
let openCards = new Set();

// ── 누적 추이 ──
function trendHTML(id){
  const arr = (allHistory.series && allHistory.series[id]) || [];
  if(arr.length < 2) return `<div class="detail-row"><span class="detail-label">최근 추이</span><span class="detail-val">데이터 누적 중</span></div>`;
  const last = arr[arr.length-1];
  const refIdx = Math.max(0, arr.length-6);
  const ref = arr[refIdx];
  const lastP = parseFloat(last.p), refP = parseFloat(ref.p);
  if(!lastP || !refP) return "";
  const diffPct = ((lastP-refP)/refP*100);
  const cls = diffPct>0?"pos":diffPct<0?"neg":"flat";
  return `<div class="detail-row"><span class="detail-label">${ref.d} 대비</span><span class="detail-val ${cls}">${fmtPct(diffPct)} (${arr.length}일 누적)</span></div>`;
}

function chgClass(v, dir){
  if(!v) return "flat";
  if(dir==="up") return "pos";
  if(dir==="dn") return "neg";
  const n = parseFloat(v);
  return n>0?"pos":n<0?"neg":"flat";
}

function fmt(v){ return (v||v===0) ? Number(v).toLocaleString("ko-KR") : "—"; }

// ── 상승/하락 표기 통일 헬퍼: 금액은 세모(▲빨강/▼파랑), 퍼센트는 +/- 부호 ──
// n(부호 있는 숫자)을 받아 { cls, tri, sign } 반환
function signInfo(n){
  if(n > 0)  return { cls:"pos",  tri:"▲", sign:"+" };
  if(n < 0)  return { cls:"neg",  tri:"▼", sign:"-" };
  return { cls:"flat", tri:"", sign:"" };
}
// 금액(원) 표시: ▲1,234원 / ▼1,234원  (색상은 호출부에서 cls 클래스로 적용)
function fmtAmt(n){
  const s = signInfo(n);
  return `${s.tri}${fmt(Math.abs(Math.round(n)))}원`;
}
// 퍼센트 표시: +1.23% / -1.23%
function fmtPct(n, digits=2){
  const s = signInfo(n);
  return `${s.sign}${Math.abs(n).toFixed(digits)}%`;
}
// 등락률처럼 이미 "방향(dir)"이 별도로 주어지는 경우 부호만 통일해서 표시
function fmtPctByDir(v, dir, digits=2){
  const n = Math.abs(parseFloat(v) || 0);
  const sign = dir==="up" ? "+" : dir==="dn" ? "-" : "";
  return `${sign}${n.toFixed(digits)}%`;
}

// ── 카드 렌더 ──
function cardHTML(e){
  const cat = e.cat || "kr_idx";
  const isOpen = openCards.has(e.id);
  const statusClass = e.fetch_ok ? "ok" : (e.price ? "pending" : "fail");
  const chgDisplay = e.chg ? fmtPctByDir(e.chg, e.chg_dir, 2) : "—";

  const price = parseFloat(e.price) || 0;
  const qty = e.qty || 0;
  const avg = e.avg_price || 0;
  const value = qty * price;
  const cost = qty * avg;
  const pnl = value - cost;
  const pnlPct = cost > 0 ? (pnl/cost*100) : 0;
  const monthlyDist = (e.myield && price) ? Math.round(qty * price * e.myield / 100) : 0;

  return `
<div class="etf-card ${statusClass}" id="card-${e.id}">
  <div class="card-head" onclick="toggleCard('${e.id}')">
    <div style="min-width:0">
      <div class="card-name">${e.name}</div>
      <div class="card-meta">${e.code} · ${qty.toLocaleString("ko-KR")}주 보유</div>
    </div>
    <span class="tag tag-${cat}">${CAT_LABELS[cat]||""}</span>
  </div>
  <div class="metrics">
    <div class="metric">
      <div class="metric-label">현재가</div>
      <div class="metric-val" style="font-size:11px">${e.price ? fmt(e.price)+"원" : "—"}</div>
    </div>
    <div class="metric">
      <div class="metric-label">등락</div>
      <div class="metric-val ${chgClass(e.chg, e.chg_dir)}">${chgDisplay}</div>
    </div>
    <div class="metric">
      <div class="metric-label">평가금액</div>
      <div class="metric-val" style="font-size:11px">${fmt(Math.round(value))}원</div>
    </div>
    <div class="metric">
      <div class="metric-label">평가손익</div>
      <div class="metric-val ${pnl>=0?'pos':'neg'}" style="font-size:10px">${fmtAmt(pnl)}</div>
    </div>
    <div class="metric">
      <div class="metric-label">손익률</div>
      <div class="metric-val ${pnl>=0?'pos':'neg'}">${fmtPct(pnlPct, 1)}</div>
    </div>
  </div>
  <div class="card-detail ${isOpen?"open":""}">
    <div class="detail-row"><span class="detail-label">보유수량</span><span class="detail-val">${qty.toLocaleString("ko-KR")}주</span></div>
    <div class="detail-row"><span class="detail-label">평균매입가</span><span class="detail-val">${fmt(avg)}원</span></div>
    <div class="detail-row"><span class="detail-label">평가손익</span><span class="detail-val ${pnl>=0?'pos':'neg'}">${fmtAmt(pnl)} (${fmtPct(pnlPct)})</span></div>
    <div class="detail-row"><span class="detail-label">월배당율</span><span class="detail-val">${e.myield ? e.myield+"%" : "—"}</span></div>
    <div class="detail-row"><span class="detail-label">이번달 예상 분배금</span><span class="detail-val">${monthlyDist ? fmt(monthlyDist)+"원" : "—"}</span></div>
    <div class="detail-row"><span class="detail-label">누적분배금</span><span class="detail-val" style="color:var(--warning)">${fmt(e.cum_dist||0)}원</span></div>
    <div class="detail-row"><span class="detail-label">NAV</span><span class="detail-val">${fmt(e.nav)}원</span></div>
    <div class="detail-row"><span class="detail-label">순자산(AUM)</span><span class="detail-val">${fmt(e.aum)}억원</span></div>
    <div class="detail-row"><span class="detail-label">52주 최고</span><span class="detail-val">${fmt(e.w52_high)}원</span></div>
    <div class="detail-row"><span class="detail-label">52주 최저</span><span class="detail-val">${fmt(e.w52_low)}원</span></div>
    ${trendHTML(e.id)}
    <div class="detail-row"><span class="detail-label">마지막 갱신</span><span class="detail-val">${e.updated||"—"}</span></div>
  </div>
</div>`;
}

// ── 재사용 가능한 포트폴리오 요약 블록 (전체 히어로 + 카테고리별 요약에서 공용) ──
function portfolioBlockHTML(etfs, title){
  let totalValue=0, totalCost=0, totalDayChange=0, totalMonthlyDist=0, cumDist=0;

  etfs.forEach(e=>{
    const price = parseFloat(e.price) || 0;
    const qty = e.qty || 0;
    const value = qty * price;
    totalValue += value;
    totalCost += qty * (e.avg_price || 0);
    const chgPct = parseFloat(e.chg) || 0;
    const signedPct = e.chg_dir==="up" ? chgPct : e.chg_dir==="dn" ? -chgPct : 0;
    totalDayChange += value * signedPct / 100;
    if(e.myield && price) totalMonthlyDist += qty * price * e.myield / 100;
    cumDist += e.cum_dist || 0;   // 매월 20일에 실제 적립된 누적분배금 (crawl.py가 계산)
  });

  const totalPnl = totalValue - totalCost;
  const totalPnlPct = totalCost>0 ? (totalPnl/totalCost*100) : 0;
  const prevValue = totalValue - totalDayChange;
  const dayPct = prevValue>0 ? (totalDayChange/prevValue*100) : 0;
  const pnlCls = totalPnl>=0 ? "pos" : "neg";
  const chgCls = totalDayChange>=0 ? "pos" : "neg";

  const finalPnl = totalPnl + cumDist;
  const finalPnlPct = totalCost>0 ? (finalPnl/totalCost*100) : 0;
  const finalCls = finalPnl>=0 ? "pos" : "neg";

  return `
<div class="hero">
  <div class="hero-title">${title}</div>
  <div class="hero-metrics">
    <div class="hero-metric">
      <div class="hero-metric-label">기초금액</div>
      <div class="hero-metric-val">${fmt(Math.round(totalCost))}원</div>
    </div>
    <div class="hero-metric">
      <div class="hero-metric-label">평가액</div>
      <div class="hero-metric-val">${fmt(Math.round(totalValue))}원</div>
    </div>
    <div class="hero-metric">
      <div class="hero-metric-label">평가손익</div>
      <div class="hero-metric-val ${pnlCls}">${fmtAmt(totalPnl)}</div>
    </div>
    <div class="hero-metric">
      <div class="hero-metric-label">손익률</div>
      <div class="hero-metric-val ${pnlCls}">${fmtPct(totalPnlPct)}</div>
    </div>
    <div class="hero-metric">
      <div class="hero-metric-label">전일대비</div>
      <div class="hero-metric-val ${chgCls}">${fmtAmt(totalDayChange)}</div>
      <div class="hero-metric-sub ${chgCls}">(${fmtPct(dayPct)})</div>
    </div>
  </div>
  <div class="hero-metrics hero-metrics-2">
    <div class="hero-metric">
      <div class="hero-metric-label">누적분배금</div>
      <div class="hero-metric-val" style="color:var(--warning)">${fmt(Math.round(cumDist))}원</div>
    </div>
    <div class="hero-metric">
      <div class="hero-metric-label">최종손익(분배금포함)</div>
      <div class="hero-metric-val ${finalCls}">${fmtAmt(finalPnl)}</div>
      <div class="hero-metric-sub ${finalCls}">(${fmtPct(finalPnlPct)})</div>
    </div>
  </div>
  <div class="hero-div">
    <span class="hero-div-label">💰 이번달 예상 분배금</span>
    <span class="hero-div-val">${fmt(Math.round(totalMonthlyDist))}원</span>
  </div>
</div>`;
}

// ── 최상단 히어로 요약 (전체 보유종목 기준) ──
function renderHero(){
  const badge = document.getElementById("live-badge");
  if(badge){
    badge.textContent = `⏱ ${allData.updated||"—"} 기준 · 평일 10/14/18시 갱신, 분배금 20일 적립`;
  }
  document.getElementById("hero").innerHTML = portfolioBlockHTML(allData.etfs || [], "💼 내 포트폴리오 합계");
}

// ── 카테고리 요약 ──
function summaryHTML(etfs){
  const up = etfs.filter(e=>e.chg_dir==="up").length;
  const dn = etfs.filter(e=>e.chg_dir==="dn").length;
  const ok = etfs.filter(e=>e.fetch_ok).length;
  const value = etfs.reduce((s,e)=> s + (e.qty||0)*(parseFloat(e.price)||0), 0);
  return `
<div class="summary">
  <div class="sum-card">
    <div class="sum-label">보유종목</div>
    <div class="sum-val" style="color:var(--accent)">${etfs.length}</div>
    <div class="sum-sub">수집성공 ${ok}개</div>
  </div>
  <div class="sum-card">
    <div class="sum-label">상승/하락</div>
    <div class="sum-val"><span style="color:var(--rise)">▲${up}</span> <span style="color:var(--fall)">▼${dn}</span></div>
    <div class="sum-sub">보합 ${etfs.length-up-dn}개</div>
  </div>
  <div class="sum-card">
    <div class="sum-label">구간 평가금액</div>
    <div class="sum-val" style="font-size:13px;color:var(--success)">${fmt(Math.round(value))}원</div>
    <div class="sum-sub">평일 10/14/18시 갱신</div>
  </div>
</div>`;
}

// ── 탭 렌더 ──
function renderTab(){
  document.getElementById("tab-nav").innerHTML = TABS.map(t=>
    `<button class="tab${activeTab===t.id?" active":""}" onclick="switchTab('${t.id}')">${t.label}</button>`
  ).join("");

  const etfs = activeTab==="all" ? allData.etfs : allData.etfs.filter(e=>e.cat===activeTab);

  let html = activeTab==="all"
    ? summaryHTML(etfs)
    : portfolioBlockHTML(etfs, `💼 ${CAT_LABELS[activeTab]} 합계`) + summaryHTML(etfs);

  if(activeTab==="all"){
    ["kr_idx","kr_div","us_idx","us_div"].forEach(cat=>{
      const group = etfs.filter(e=>e.cat===cat);
      if(!group.length) return;
      html += `<div class="section-title">${CAT_LABELS[cat]}</div><div class="etf-list">${group.map(cardHTML).join("")}</div>`;
    });
  } else {
    html += `<div class="etf-list">${etfs.map(cardHTML).join("")}</div>`;
  }

  document.getElementById("app-content").innerHTML = html;
  renderHero();
}

function switchTab(id){ activeTab=id; renderTab(); }
function toggleCard(id){ openCards.has(id)?openCards.delete(id):openCards.add(id); renderTab(); }

// ── 데이터 로드 ──
async function loadData(){
  document.getElementById("app-content").innerHTML =
    `<div class="loading"><div class="spinner">⏳</div><br>데이터 로딩 중...</div>`;
  document.getElementById("error-banner").style.display = "none";

  try {
    const res = await fetch("data/etf_data.json?t="+Date.now());
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    allData = await res.json();

    try {
      const hres = await fetch("data/history.json?t="+Date.now());
      if(hres.ok) allHistory = await hres.json();
    } catch(_) { /* history 없어도 정상 동작 */ }

    renderTab();
  } catch(e) {
    console.warn("데이터 로드 실패:", e.message);
    allData = { updated: "—", etfs: [] };
    const banner = document.getElementById("error-banner");
    banner.style.display = "block";
    banner.textContent = "⚠ 데이터 파일을 찾을 수 없습니다. GitHub Actions를 먼저 실행해 주세요.";
    renderTab();
  }
}

loadData();
</script>
